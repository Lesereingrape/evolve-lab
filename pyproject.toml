[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evolab"
version = "0.1.0"
description = "A CPU-only, dependency-free self-optimizing agent: evolution rediscovers and blends single-machine dispatching rules purely from an exact tardiness verifier."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lesereingrape" }]
keywords = ["self-optimization", "alphaevolve", "darwin-godel-machine", "heuristic-discovery", "evolution", "scheduling"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14,<0.15"]

[project.scripts]
evolab = "evolab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF", "B", "C4", "SIM", "FURB"]
ignore = ["SIM105"]
